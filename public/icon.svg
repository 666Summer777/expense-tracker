<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Chart arcs -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#3b82f6" stroke-width="28" stroke-dasharray="250 753" stroke-linecap="round" transform="rotate(-90 256 240)"/>
  <circle cx="256" cy="240" r="160" fill="none" stroke="#22c55e" stroke-width="28" stroke-dasharray="300 703" stroke-linecap="round" transform="rotate(55 256 240)"/>
  <circle cx="256" cy="240" r="160" fill="none" stroke="#f59e0b" stroke-width="28" stroke-dasharray="200 803" stroke-linecap="round" transform="rotate(200 256 240)"/>
  <!-- $ sign -->
  <text x="256" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="120" font-weight="700" fill="#ffffff" letter-spacing="-2">$</text>
</svg>
